name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  node:
    name: Node.js checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Build web app
        run: npm run build --if-present

      - name: Build Function Compute server
        run: npm run build:fc-server --if-present

  android:
    name: Android Gradle build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build static web assets for Android
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_REALTIME_PROXY_URL: wss://example.com/realtime

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Run Android Gradle build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
